<script>
  // Sizes the kiosk for the device it's on. Every size in the styles is multiplied by --s:
  //   phone upright ~0.85-1, phone sideways ~0.7-0.9, tablet ~0.9-1.15,
  //   big upright kiosk screen (e.g. 1080 x 1920) ~1.3+, desktop / TV grows with the screen.
  (function () {
    function fitDevice() {
      var w = window.innerWidth, h = window.innerHeight, short = Math.min(w, h), portrait = h >= w;
      var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
      var device, s;
      if (short < 520 && !portrait) { device = 'phone-landscape'; s = Math.max(.7, Math.min(.9, h / 520)); }
      else if (short < 600) { device = 'phone'; s = Math.max(.82, Math.min(1, w / 430)); }
      else if (portrait && h >= 1500) { device = 'kiosk'; s = Math.max(1.1, Math.min(1.8, w / 830)); }
      else if (short < 1100 && (touch || portrait)) { device = 'tablet'; s = Math.max(.9, Math.min(1.2, short / 820)); }
      else { device = 'desktop'; s = Math.max(.9, Math.min(1.5, Math.min(w / 1280, h / 820))); }
      document.documentElement.style.setProperty('--s', s.toFixed(3));
      document.documentElement.setAttribute('data-device', device);
    }
    fitDevice();
    window.addEventListener('resize', fitDevice);
    window.addEventListener('orientationchange', function () { setTimeout(fitDevice, 150); });
  })();

        '<div class="tent">' + (entry || '&nbsp;') + '</div><div class="err">' + (msg || '') + '</div>' +

      if (it.side) bits.push(esc(P[it.side].name));
      if (it.drink) bits.push(esc(P[it.drink].name));
    } else if (p.sizes) bits.push(/McFlurry/.test(p.name) ? (it.size === 'S' ? 'Snack' : 'Regular') : SIZE[it.size]);
    (it.no || []).forEach(function (g) { bits.push('<span class="no">No ' + esc(g) + '</span>'); });
    (it.extra || []).forEach(function (g) { bits.push('<span class="ex">Extra ' + esc(g) + '</span>'); });
    return bits.join(' · ');
  }

  // ---------------------------------------------------------------- item builder
  // Steps: meal? -> size -> side -> drink -> summary (customize is a page off the summary)
  function startBuild(code, editIdx) {
    var p = P[code], it;
    if (editIdx !== undefined) it = clone(S.cart[editIdx]);
    else {
      it = { code: code, qty: 1, no: [], extra: [] };
      if (p.sizes) it.size = p.sizes.M ? 'M' : Object.keys(p.sizes)[0];
      if (p.meal) setupMeal(it);
    }
    S.build = { it: it, edit: editIdx, askMeal: editIdx === undefined && !p.meal && !!mealFor(code), step: null, from: code };
    S.build.step = editIdx !== undefined ? 'summary' : firstStep();
    S.view = 'build';
    render();
  }
  function setupMeal(it) {
    var p = P[it.code];
    it.size = p.meal.fixedSize || 'M';
    var sides = CH.sides[p.meal.sides] || [];
    it.side = sides[0] ? sides[0].code : null;
    it.drink = null;
    delete it.sizesPicked;
  }
  function steps() {
    var b = S.build, p = P[b.it.code], out = [];
    if (b.askMeal) out.push(['meal', 'Meal?']);
    if (p.meal) {
      if (!p.meal.fixedSize) out.push(['size', 'Size']);
      if ((CH.sides[p.meal.sides] || []).length > 1) out.push(['side', 'Side']);
      out.push(['drink', 'Drink']);
    } else if (p.sizes && Object.keys(p.sizes).length > 1) out.push(['size', 'Size']);
    out.push(['summary', 'Review']);
    return out;
  }
  function firstStep() { return steps()[0][0]; }
  function nextStep() {
    var st = steps(), i = st.map(function (x) { return x[0]; }).indexOf(S.build.step);
    S.build.step = st[Math.min(st.length - 1, i + 1)][0];
    render();
  }
  function prevStep() {
    var b = S.build;
    if (b.step === 'customize') { b.step = 'summary'; return render(); }
    var st = steps(), i = st.map(function (x) { return x[0]; }).indexOf(b.step);
    if (i <= 0 || b.edit !== undefined && b.step === 'summary') { S.build = null; S.view = b.edit !== undefined ? 'review' : 'menu'; return render(); }
    b.step = st[i - 1][0];
    render();
  }
  function opt(attrs, p, label, sub, on, disabled) {
    return '<button class="opt' + (on ? ' on' : '') + '" ' + attrs + (disabled ? ' disabled' : '') + ' style="--tint:' + tint(p) + '"><span class="art">' + art(p) + '</span>' +
      esc(label) + (sub ? '<small>' + sub + '</small>' : '') + '</button>';
  }
  function buildView() {
    var b = S.build, it = b.it, p = P[it.code], st = steps(), body = '', foot = '';
    var names = st.map(function (x) { return x[0]; }), cur = names.indexOf(b.step === 'customize' ? 'summary' : b.step);
    if (b.step === 'meal') {
      var mc = mealFor(b.from), m = P[mc], base = P[b.from];
      body = '<h3>Make it a Meal?</h3><div class="opts two">' +
        opt('data-meal="1"', m, 'Make it a Meal', 'With fries and a drink · ' + money(m.price), false) +
        opt('data-meal="0"', base, base.name + ' only', money(base.price), false) + '</div>';
    } else if (b.step === 'size') {
      if (p.meal) {
        body = '<h3>Choose a size</h3><div class="opts two">' +
          opt('data-size="M"', P[400], 'Medium', 'Medium fries & drink · ' + money(p.price), it.size === 'M') +
          opt('data-size="L"', P[400], 'Large', 'Large fries & drink · +' + money(p.meal.large || 0), it.size === 'L') + '</div>';
      } else {
        body = '<h3>Choose a size</h3><div class="opts two">' + Object.keys(p.sizes).map(function (z) {
          var nm = /McFlurry/.test(p.name) ? (z === 'S' ? 'Snack Size' : 'Regular') : SIZE[z];
          return opt('data-size="' + z + '"', p, nm, money(p.sizes[z]), it.size === z);
        }).join('') + '</div>';
      }
    } else if (b.step === 'side') {
      body = '<h3>Choose your side</h3><div class="opts">' + (CH.sides[p.meal.sides] || []).map(function (c) {
        var sp = P[c.code];
        return opt('data-side="' + c.code + '"', sp, (p.meal.fixedSize ? '' : SIZE[it.size] + ' ') + sp.name, c.up ? '+' + money(c.up) : 'Included', it.side === c.code, store.outages[c.code]);
      }).join('') + '</div>';
    } else if (b.step === 'drink') {
      body = '<h3>Choose your drink</h3><div class="opts">' + (CH.drinks[p.meal.drinks] || []).map(function (c) {
        var dp = P[c.code];
        return opt('data-drink="' + c.code + '"', dp, dp.name, c.up ? '+' + money(c.up) : 'Included', it.drink === c.code, store.outages[c.code]);
      }).join('') + '</div>';
    } else if (b.step === 'customize') {
      body = '<h3>Customize ' + esc((p.meal ? P[p.meal.main] : p).name) + '</h3>' + ingredients(it).map(function (g) {
        var state = it.no.indexOf(g) >= 0 ? 0 : it.extra.indexOf(g) >= 0 ? 2 : 1;
        var lbl = ['<small class="no">None</small>', '<small>Regular</small>', '<small class="ex">Extra' + (ADD[g] ? ' · +' + money(ADD[g]) : '') + '</small>'][state];
        return '<div class="ing"><div class="t">' + esc(g) + lbl + '</div><button class="round" data-ing="' + esc(g) + '" data-d="-1"' + (state === 0 ? ' disabled' : '') + ' aria-label="Less">−</button>' +
          '<button class="round" data-ing="' + esc(g) + '" data-d="1"' + (state === 2 ? ' disabled' : '') + ' aria-label="More">+</button></div>';
      }).join('');
      foot = '<button class="btn" data-act="custom-done">Done</button>';
    } else {  // summary
      var rows = '';
      if (p.meal) {
        var main = P[p.meal.main];
        rows += srow(main, main.name, (p.meal.fixedSize ? '' : SIZE[it.size] + ' Meal'), names.indexOf('size') >= 0 ? 'size' : null);
        if (it.side) rows += srow(P[it.side], (p.meal.fixedSize ? '' : SIZE[it.size] + ' ') + P[it.side].name, '', names.indexOf('side') >= 0 ? 'side' : null);
        if (it.drink) rows += srow(P[it.drink], P[it.drink].name, '', 'drink');
      } else rows += srow(p, p.name, p.sizes ? (/McFlurry/.test(p.name) ? (it.size === 'S' ? 'Snack Size' : 'Regular') : SIZE[it.size]) : '', names.indexOf('size') >= 0 ? 'size' : null);
      var mods = describe({ code: it.code, no: it.no, extra: it.extra });
      mods = (it.no.length || it.extra.length) ? '<div class="mods">' + mods.split(' · ').filter(function (x) { return /class="(no|ex)"/.test(x); }).join(' · ') + '</div>' : '';
      body = '<h3>' + (b.edit !== undefined ? 'Update your item' : 'Your ' + (p.meal ? 'meal' : 'item')) + '</h3><div class="summary">' + rows + mods +
        (ingredients(it).length ? '<div><button class="btn line" data-act="customize">Customize</button></div>' : '') + '</div>';
      foot = '<div class="qty"><button class="round" data-q="-1"' + (it.qty <= 1 ? ' disabled' : '') + ' aria-label="Less">−</button><span>' + it.qty + '</span>' +
        '<button class="round" data-q="1"' + (it.qty >= 20 ? ' disabled' : '') + ' aria-label="More">+</button></div><span class="grow"></span>' +
        '<button class="btn" data-act="add">' + (b.edit !== undefined ? 'Update Order' : 'Add to Order') + ' · ' + money(unit(it) * it.qty) + '</button>';
    }
    return '<div class="view"><div class="build"><div class="bhead" style="--tint:' + tint(p) + '"><button class="back" data-act="back">‹ Back</button>' +
      '<span class="art">' + art(p) + '</span><h2>' + esc(p.name) + '</h2><span class="price">' + money(unit(it) * it.qty) + '</span></div>' +
      (st.length > 1 ? '<div class="steps">' + st.map(function (x, i) {
        return '<span class="' + (i < cur ? 'done' : i === cur ? 'on' : '') + '">' + x[1] + '</span>';
      }).join('') + '</div>' : '') +
      '<div class="bbody">' + body + '</div>' + (foot ? '<div class="bfoot">' + foot + '</div>' : '<div class="bfoot"><span class="grow"></span><button class="btn line" data-act="cancel-item">Cancel Item</button></div>') + '</div></div>';
  }
  function srow(p, title, sub, go) {
    return '<div class="srow"><span class="art">' + art(p) + '</span><div class="t">' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>' +
      (go ? '<button class="link" data-go="' + go + '">Change</button>' : '') + '</div>';
  }
  function addToOrder() {
    var b = S.build, it = b.it;
    if (b.edit !== undefined) { S.cart[b.edit] = it; S.build = null; S.view = 'review'; return render(); }
    S.cart.push(it);
    S.build = null;
    S.view = 'menu';
    render();
    // Real kiosks suggest a dessert once, after the first sandwich or meal
    var p = P[it.code];
    if (!S.suggested && (p.meal || p.cat === 'burgers' || p.cat === 'chicken')) { S.suggested = true; suggest(); }
  }
  function suggest() {
    var codes = [604, 606, 607, 600].filter(function (c) { return P[c] && !store.outages[c] && served(c); });
    if (!codes.length) return;
    var bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet"><h3>Complete your meal?</h3><p class="sub">Add something sweet to your order.</p><div class="opts">' + codes.map(function (c) {
      var p = P[c];
      return opt('data-sugg="' + c + '"', p, p.name, money(p.sizes ? p.sizes.S || p.price : p.price), false);
    }).join('') + '</div><div class="end"><button class="btn line" data-act="nothanks">No Thanks</button></div></div>';
    $('app').appendChild(bg);
  }

  // ---------------------------------------------------------------- checkout
  var placing = false;
  function checkout() {
    if (!S.cart.length || placing) return;
    var err = $('err');
    if (location.protocol.indexOf('http') !== 0) { err.textContent = 'The kiosk needs the simulator server running.'; return; }
    placing = true;
    var btn = document.querySelector('[data-act="checkout"]');
    btn.disabled = true; btn.textContent = 'Sending…';
    var t = totals(), n = count();
    fetch('/api/kiosk/order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dine: S.dine, table: S.table, promo: S.promo ? S.promo.code : null, mymcd: S.member ? { code: S.member.code, offer: S.offer && S.offer.id, type: S.offer && S.offer.type } : null,
        items: S.cart.map(function (it) {
        return { code: it.code, qty: it.qty, size: it.size, side: it.side, drink: it.drink, no: it.no, extra: it.extra };
      }) })
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Could not send the order.'); return j; }); })
      .then(function (j) {
        var oi = offerInfo();
        S.done = { code: j.code, number: j.number, total: t.total, items: n, table: S.table, promo: S.promo ? S.promo.pct : null, member: S.member && S.member.name, offer: oi && !oi.why ? oi.offer.name : null,
          newCode: S.member && S.joined === S.member.code ? S.member.code : null };
        S.dineDone = S.dine;
        S.cart = []; S.view = 'done';
        render();
        countdown(45);
      })
      .catch(function (e) { err.textContent = e.message + ' Please try again, or order at the front counter.'; btn.disabled = false; btn.textContent = 'Checkout'; })
      .then(function () { placing = false; });
  }
  var cdTimer = null;
  function countdown(sec) {
    clearInterval(cdTimer);
    var left = sec;
    var tick = function () { var c = $('count'); if (c) c.textContent = 'This screen will reset in ' + left + ' seconds.'; if (left-- <= 0) reset(); };
    tick();
    cdTimer = setInterval(tick, 1000);
  }
  function reset() {
    clearInterval(cdTimer);
    S.view = 'attract'; S.dine = null; S.table = null; S.cart = []; S.cat = 'featured'; S.build = null; S.suggested = false; S.tentEntry = ''; S.listTop = 0;
    S.member = null; S.offer = null; S.promo = null; S.mymAsked = false; S.mymEntry = ''; S.mymErr = ''; S.mymBusy = false; S.joined = null;
    closeModal();
    render();
  }
  function confirmCancel() {
    if (!S.cart.length) return reset();
    modal('Start over?', 'This will remove everything from your order.', [['Keep Ordering', 'line', closeModal], ['Start Over', '', reset]]);
  }
  function modal(title, text, btns) {
    closeModal();
    var bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.id = 'modal';
    bg.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p id="modalText">' + esc(text) + '</p><div class="row">' + btns.map(function (b, i) {
      return '<button class="btn ' + b[1] + '" data-m="' + i + '">' + esc(b[0]) + '</button>';
    }).join('') + '</div></div>';
    bg.addEventListener('click', function (e) { var x = e.target.closest('[data-m]'); if (x) btns[+x.getAttribute('data-m')][2](); });
    $('app').appendChild(bg);
  }
  function closeModal() { var m = $('modal'); if (m) m.remove(); }

  // ---------------------------------------------------------------- idle
  var lastTouch = Date.now();
  document.addEventListener('pointerdown', function () { lastTouch = Date.now(); }, true);
  setInterval(function () {
    if (S.view === 'attract' || S.view === 'done' || store.locked) return;
    var idle = (Date.now() - lastTouch) / 1000;
    if (idle > 75) return reset();
    if (idle > 60) {
      if (!$('modal')) modal('Do you need more time?', '', [['I need more time', '', function () { lastTouch = Date.now(); closeModal(); }]]);
      $('modalText').textContent = 'Your order will be cleared in ' + Math.ceil(75 - idle) + ' seconds.';
    }
  }, 500);

  // ---------------------------------------------------------------- touches
  $('app').addEventListener('click', function (e) {
    var t = e.target, x;
    if ((x = t.closest('[data-sugg]'))) {
      var c = +x.getAttribute('data-sugg'), p = P[c];
      S.cart.push({ code: c, qty: 1, size: p.sizes ? (p.sizes.S ? 'S' : 'M') : undefined, no: [], extra: [] });
      x.closest('.sheet-bg').remove(); render(); return;
    }
    if ((x = t.closest('[data-dine]'))) {
      S.dine = x.getAttribute('data-dine');
      if (S.dine === 'EAT IN') { S.tentEntry = S.table ? String(S.table) : ''; S.view = 'table'; }
      else { S.table = null; S.view = afterWhere(); }
      return render();
    }
    if ((x = t.closest('[data-mymk]'))) {
      var mk = x.getAttribute('data-mymk');
      S.mymErr = '';
      S.mymEntry = mk === 'C' ? '' : mk === '⌫' ? (S.mymEntry || '').slice(0, -1) : ((S.mymEntry || '') + mk).slice(0, 8);
      return render();
    }
    if (S.view === 'mymrewards' && (x = t.closest('[data-mo]'))) {
      var oid = x.getAttribute('data-mo');
      S.offer = S.offer && S.offer.id === oid ? null : { id: oid, type: x.getAttribute('data-mt') };
      return render();
    }
    if ((x = t.closest('[data-key]'))) {
      var k = x.getAttribute('data-key');
      S.tentEntry = k === 'C' ? '' : k === '⌫' ? (S.tentEntry || '').slice(0, -1) : ((S.tentEntry || '') + k).replace(/^0+/, '').slice(0, 3);
      return render();
    }
    if ((x = t.closest('[data-cat]'))) { S.cat = x.getAttribute('data-cat'); S.listTop = 0; return render(); }
    if ((x = t.closest('[data-code]'))) { var l = document.querySelector('.list'); S.listTop = l ? l.scrollTop : 0; return startBuild(+x.getAttribute('data-code')); }
    if ((x = t.closest('[data-meal]'))) {
      var b = S.build;
      if (x.getAttribute('data-meal') === '1') { b.it = { code: mealFor(b.from), qty: b.it.qty, no: b.it.no, extra: b.it.extra }; setupMeal(b.it); }
      b.askMeal = false;
      b.step = firstStep(); return render();
    }
    if ((x = t.closest('[data-size]'))) { S.build.it.size = x.getAttribute('data-size'); return nextStep(); }
    if ((x = t.closest('[data-side]'))) { S.build.it.side = +x.getAttribute('data-side'); return nextStep(); }
    if ((x = t.closest('[data-drink]'))) { S.build.it.drink = +x.getAttribute('data-drink'); return nextStep(); }
    if ((x = t.closest('[data-go]'))) { S.build.step = x.getAttribute('data-go'); return render(); }
    if ((x = t.closest('[data-ing]'))) {
      var it = S.build.it, g = x.getAttribute('data-ing'), d = +x.getAttribute('data-d');
      var state = it.no.indexOf(g) >= 0 ? 0 : it.extra.indexOf(g) >= 0 ? 2 : 1;
      state = Math.max(0, Math.min(2, state + d));
      it.no = it.no.filter(function (y) { return y !== g; }); it.extra = it.extra.filter(function (y) { return y !== g; });
      if (state === 0) it.no.push(g); if (state === 2) it.extra.push(g);
      var bb = document.querySelector('.bbody'), top = bb ? bb.scrollTop : 0;
      render(); bb = document.querySelector('.bbody'); if (bb) bb.scrollTop = top;
      return;
    }
    if ((x = t.closest('[data-q]'))) { var it2 = S.build.it; it2.qty = Math.max(1, Math.min(20, it2.qty + +x.getAttribute('data-q'))); return render(); }
    if ((x = t.closest('[data-edit]'))) { var i = +x.getAttribute('data-edit'); return startBuild(S.cart[i].code, i); }
    if ((x = t.closest('[data-rm]'))) { S.cart.splice(+x.getAttribute('data-rm'), 1); return render(); }
    if ((x = t.closest('[data-act]'))) {
      var a = x.getAttribute('data-act');
      if (a === 'start') { S.view = 'where'; return render(); }
      if (a === 'cancel') return confirmCancel();
      if (a === 'where') { S.view = 'where'; return render(); }
      if (a === 'notable') { S.table = null; S.view = afterWhere(); return render(); }
      if (a === 'settable') { S.table = +S.tentEntry || null; S.view = afterWhere(); return render(); }
      if (a === 'mymskip') { S.mymEntry = ''; S.mymErr = ''; S.view = S.cart.length ? 'review' : 'menu'; return render(); }
      if (a === 'mymgo') return mymCheck();
      if (a === 'mymjoin') return mymJoin();
      if (a === 'mymdone') { S.view = S.cart.length ? 'review' : 'menu'; return render(); }
      if (a === 'mym-remove-start') { S.member = null; S.offer = null; S.mymEntry = ''; S.view = 'mymask'; return render(); }
      if (a === 'review') { S.view = 'review'; return render(); }
      if (a === 'menu') { S.view = 'menu'; return render(); }
      if (a === 'back') return prevStep();
      if (a === 'cancel-item') { var e2 = S.build.edit; S.build = null; S.view = e2 !== undefined ? 'review' : 'menu'; return render(); }
      if (a === 'customize') { S.build.step = 'customize'; return render(); }
      if (a === 'custom-done') { S.build.step = 'summary'; return render(); }
      if (a === 'add') return addToOrder();
      if (a === 'nothanks') { x.closest('.sheet-bg').remove(); return; }
      if (a === 'checkout') return checkout();
      if (a === 'finish') return reset();
      if (a === 'mym') return mymCode();
      if (a === 'mym-offers') return mymOffers();
      if (a === 'mym-nooffer') { S.offer = null; return render(); }
      if (a === 'mym-remove') { S.member = null; S.offer = null; return render(); }
      if (a === 'promo') return promoEntry();
      if (a === 'promo-remove') { S.promo = null; return render(); }
    }
  });
  $('a11y').addEventListener('click', function () { document.body.classList.toggle('reach'); });

  // After a server reboot / soft reboot: reload only when no one is in the middle of an order
  window.NP6_BEFORE_RELOAD = function () { return S.view === 'attract' || S.view === 'done' || store.locked; };
  render();
  loadStore();
  setInterval(loadStore, 30000);
  fetch('assets/products/manifest.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
    if (!m) return;
    (m.codes || []).forEach(function (c) { PHOTOS[c] = true; });
    (m.logos || []).forEach(function (c) { LOGOS[c] = true; });
    if (!document.querySelector('.sheet-bg, #modal')) render();
  }).catch(function () {});
})();
</script>
</body>
</html>

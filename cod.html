<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/logo.png">
<title>Customer Order Display</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #27251f; color: #fff; font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: #da291c; border-bottom: 6px solid #ffc72c; }
  header img { height: 56px; }
  header h1 { margin: 0; font-size: 30px; flex: 1; }
  header .pos { font-size: 16px; opacity: .85; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .idle, .thanks { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 20px; }
  .idle img { width: 36vmin; }
  .idle h2, .thanks h2 { font-size: 6vmin; margin: 0; color: #ffc72c; }
  .idle p, .thanks p { font-size: 3.4vmin; margin: 0; }
  .thanks .big { font-size: 10vmin; font-weight: bold; }
  .order { flex: 1; overflow: auto; padding: 14px 26px; font-size: 3.4vmin; }
  .row { display: flex; gap: 14px; padding: 5px 0; }
  .row .q { width: 2.5em; text-align: right; font-weight: bold; }
  .row .t { flex: 1; }
  .row .p { width: 6em; text-align: right; }
  .row.sub { font-size: .75em; color: #ddd; padding: 1px 0; }
  .row.sub .t { padding-left: 1.2em; }
  .row.mod .t { color: #ffa8a8; }
  .row.promo .t, .row.offer .t { color: #ffc72c; }
  .row.missing { display: none; }
  .member { background: #da291c; padding: 8px 26px; font-size: 2.6vmin; }
  .total { display: flex; justify-content: space-between; align-items: center; padding: 16px 26px; background: #ffc72c; color: #27251f; font: bold 6vmin Arial; }
  .total small { font-size: .45em; font-weight: normal; display: block; }
  .note { text-align: center; padding: 10px; font-size: 2.6vmin; color: #ffc72c; }
</style>
</head>
<body>
<header><img src="assets/logo.png" alt=""><h1 id="store">Welcome</h1><span class="pos" id="pos"></span></header>
<main id="main"></main>
<script src="js/db.js"></script>
<script src="js/reload.js"></script>
<script>
(function () {
  'use strict';
  var pos = (location.search.match(/pos=(\d+)/) || [0, '1'])[1];
  document.getElementById('pos').textContent = 'Lane ' + pos;
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function money(c) { return (c < 0 ? '-$' : '$') + (Math.abs(c) / 100).toFixed(2); }
  var last = '';
  function draw(doc) {
    var key = JSON.stringify(doc || {});
    if (key === last) return;
    last = key;
    var m = document.getElementById('main');
    if (doc && doc.store) document.getElementById('store').textContent = 'Welcome to McDonald’s';
    var state = doc && doc.state;
    // A "thanks" screen shows for 10 s, then the board goes back to the welcome screen
    if (state === 'thanks' && Date.now() - doc.at > 10000) state = 'idle';
    if (!doc || state === 'idle' || !state) {
      m.innerHTML = '<div class="idle"><img src="assets/logo.png" alt=""><h2>Welcome!</h2><p>Please order when you’re ready.</p></div>';
    } else if (state === 'thanks') {
      m.innerHTML = '<div class="thanks"><h2>Thank you!</h2><p>Your total</p><div class="big">' + money(doc.total) + '</div>' +
        (doc.change ? '<p>Change ' + money(doc.change) + '</p>' : '') +
        '<p>' + (doc.pod === 'Drive Thru' ? 'Please drive to the next window.' : 'Order ' + esc(doc.number) + ' — please wait for your number.') + '</p></div>';
    } else {
      m.innerHTML = (doc.member ? '<div class="member">MyMcDonald’s • ' + esc(doc.member) + '</div>' : '') +
        '<div class="order">' + doc.rows.map(function (r) {
          return '<div class="row ' + (r.main ? '' : 'sub ') + esc(r.cls) + '"><span class="q">' + esc(r.q) + '</span><span class="t">' + esc(r.t) + '</span><span class="p">' +
            (r.p === null || r.p === undefined || (!r.main && !r.p) ? '' : money(r.p)) + '</span></div>';
        }).join('') + '</div>' +
        '<div class="note">Please check your order on the screen.</div>' +
        '<div class="total"><span>Total<small>Includes tax</small></span><span>' + money(doc.total - (doc.paid || 0)) + '</span></div>';
      var o = m.querySelector('.order'); if (o) o.scrollTop = o.scrollHeight;
    }
  }
  function load() { NP6DB.col('cod').then(function (d) { draw(d && d['pos' + pos]); }).catch(function () {}); }
  NP6DB.watch('cod', load, 700);
  setInterval(load, 2000); // also expires the thank-you screen
  load();
})();
</script>
</body>
</html>
